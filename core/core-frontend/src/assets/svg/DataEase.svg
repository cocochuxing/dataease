<svg width="640" height="180" viewBox="0 0 640 180" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>七橙智擎 logo</title>
  <desc>橙色圆角方形图标，内含由数字7与齿轮/电路元素构成的抽象标志，右侧为“七橙智擎”中文字标</desc>
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A3D"/>
      <stop offset="100%" stop-color="#E85D0B"/>
    </linearGradient>
  </defs>

  <!-- 图标：圆角方形底 -->
  <rect x="14" y="14" width="152" height="152" rx="34" fill="url(#orangeGrad)"/>

  <!-- 内部：抽象“7” + 电路节点，构成“智擎”意象 -->
  <g fill="#FFFFFF">
    <!-- “7”主体：顶横 + 斜撇，做成略带速度感的几何造型 -->
    <path d="M52 46 H128 L128 66 L92 138 H66 L100 66 H52 Z"/>
    <!-- 齿轮/引擎点缀：三个圆点连成弧线，代表智擎的动力节点 -->
    <circle cx="118" cy="104" r="7"/>
    <circle cx="98" cy="118" r="5.5"/>
    <circle cx="132" cy="128" r="5.5"/>
  </g>
  <!-- 细电路连线，呼应“智擎”科技感 -->
  <path d="M118 104 L98 118 M118 104 L132 128" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- 中文字标 -->
  <g fill="#2B2B29" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
    <text x="192" y="76" font-size="46" font-weight="700" letter-spacing="2">七橙智擎</text>
    <text x="194" y="112" font-size="17" font-weight="400" fill="#8A6A55" letter-spacing="6">QICHENG · INTELLIGENCE ENGINE</text>
  </g>
</svg>
